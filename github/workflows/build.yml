name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip and build
        run: |
          unzip -o HubZones.zip -d work

          POM="$(find work -name pom.xml -print -quit)"
          if [ -z "$POM" ]; then
            echo "ERROR: HubZones.zip ke andar pom.xml nahi mila"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$POM")"
          cd "$PROJECT_DIR"

          mvn -B package

          mkdir -p "$GITHUB_WORKSPACE/out"
          find target -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            -exec cp {} "$GITHUB_WORKSPACE/out/" \;

          ls -l "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v4
        with:
          name: HubZones-jar
          path: out/*.jar
